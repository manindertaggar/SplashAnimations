plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goldducks.test'
    compileSdk 35

    defaultConfig {
        applicationId "com.goldducks.test"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    // kotlin-stdlib 1.8+ folds in the jdk7/jdk8 extensions, which now duplicate
    // classes still pulled in transitively (via appcompat -> lifecycle -> coroutines)
    // as the separate legacy kotlin-stdlib-jdk7/jdk8 artifacts.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation project(path: ':SplashAnimations')
}
