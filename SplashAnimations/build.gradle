plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.goldducks.splashAnimations'
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

// Enables building this module as a Maven artifact via JitPack (jitpack.io),
// which replaced the now-defunct JCenter/Bintray as the distribution channel.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.manindertaggar'
                artifactId = 'SplashAnimations'
                version = android.defaultConfig.versionName
            }
        }
    }
}
